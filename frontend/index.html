<!--
  index.html — Shell HTML único de la SPA Mochi Matcha POS.
  Carga Bootstrap 5 + Bootstrap Icons + fuentes Google desde CDN, y monta
  React vía /src/main.jsx en el div#root. Vite procesa el script type=module.
-->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mochi Matcha POS</title>
    <!-- Bootstrap 5 base + iconos (sustituye a bootstrap-icons local) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <!-- Fuentes corporativas: Playfair (display), DM Sans (body), JetBrains Mono (números/ticket) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Punto de montaje de React; main.jsx hace createRoot sobre este nodo -->
    <div id="root"></div>
    <!-- bundle.min.js incluye Popper (necesario para tooltips/dropdowns/offcanvas) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
